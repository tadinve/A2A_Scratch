[project]
name = "a2aS"
version = "0.1.0"
description = "Day 01: a one-tool Google ADK agent that answers inventory questions from SQLite."
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.141.1",
    "google-adk>=1.0",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
